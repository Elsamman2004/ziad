<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOBRY FC - العد التنازلي</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: #0a000f;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    padding-bottom: 70px;
  }

  .bg-image {
    position: absolute;
    inset: 0;
    background-image: url('bg2.png');
    background-size: auto;
    background-position: center top;
    background-repeat: no-repeat;
    filter: brightness(0.22) saturate(1.5);
    z-index: 0;
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(20,60,120,0.5) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(10,30,80,0.8) 0%, transparent 60%),
      linear-gradient(180deg, rgba(5,10,30,0.6) 0%, rgba(5,10,30,0.25) 40%, rgba(5,10,30,0.92) 100%);
    z-index: 1;
  }

  .particles {
    position: absolute;
    inset: 0;
    z-index: 2;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(224,0,74,0.5);
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px
    );
  }

  .content {
    position: relative;
    z-index: 10;
    padding: 2rem 1.5rem;
    width: 100%;
    max-width: 900px;
  }

  .club-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 1.8rem;
    animation: fadeDown 1s ease forwards;
    opacity: 0;
  }

  .eggplant-icon { font-size: 2.4rem; filter: drop-shadow(0 0 12px #e0004a); }

  .club-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 6px;
    color: #fff;
    text-shadow: 0 0 20px rgba(224,0,74,0.8);
  }

  .season-tag {
    font-size: 0.75rem;
    letter-spacing: 3px;
    color: #e0004a;
    font-weight: 700;
  }

  .title-block {
    margin-bottom: 2.5rem;
    animation: fadeDown 1s ease 0.3s forwards;
    opacity: 0;
  }

  .pre-title {
    font-size: 0.95rem;
    letter-spacing: 5px;
    color: #e0004a;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  .main-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 10vw, 7rem);
    line-height: 0.9;
    color: #fff;
    text-shadow: 0 0 40px rgba(224,0,74,0.6), 0 4px 30px rgba(0,0,0,0.8);
    letter-spacing: 4px;
  }

  .main-title span {
    color: #e0004a;
    display: block;
  }

  .countdown-container {
    animation: fadeUp 1s ease 0.6s forwards;
    opacity: 0;
    margin-bottom: 2rem;
  }

  .countdown-label {
    font-size: 0.82rem;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 1.5rem;
    font-weight: 700;
  }

  .countdown-grid {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(8px, 2.5vw, 24px);
    flex-wrap: wrap;
  }

  .time-block {
    position: relative;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(224,0,74,0.3);
    border-radius: 12px;
    padding: clamp(1rem, 3vw, 1.6rem) clamp(0.8rem, 2.5vw, 1.2rem);
    min-width: clamp(68px, 17vw, 130px);
    backdrop-filter: blur(10px);
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .time-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #e0004a, transparent);
  }

  .time-block:hover {
    border-color: rgba(224,0,74,0.7);
    box-shadow: 0 0 30px rgba(224,0,74,0.4);
  }

  .time-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.4rem, 8vw, 5rem);
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 30px rgba(224,0,74,0.9);
    display: block;
  }

  .time-value.flip {
    animation: flipNum 0.3s ease;
  }

  @keyframes flipNum {
    0% { transform: translateY(-8px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .time-label {
    font-size: clamp(0.55rem, 1.8vw, 0.75rem);
    letter-spacing: 3px;
    color: #e0004a;
    font-weight: 700;
    margin-top: 4px;
  }

  .separator {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: rgba(224,0,74,0.5);
    margin-bottom: 20px;
    animation: blink 1s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .progress-section {
    animation: fadeUp 1s ease 0.9s forwards;
    opacity: 0;
    margin-bottom: 2rem;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 8px;
    font-weight: 700;
  }

  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #9b0030, #e0004a, #ff6090);
    border-radius: 2px;
    transition: width 1s ease;
    box-shadow: 0 0 12px rgba(224,0,74,0.8);
  }

  .tagline {
    font-size: 0.78rem;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.3);
    font-weight: 700;
    animation: fadeUp 1s ease 1.2s forwards;
    opacity: 0;
    margin-bottom: 1rem;
  }

  .tagline strong { color: #e0004a; }

  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,0,15,0.92);
    border-top: 1px solid rgba(224,0,74,0.25);
    padding: 0.7rem 2rem;
    display: flex;
    justify-content: center;
    gap: clamp(1.5rem, 5vw, 3.5rem);
    z-index: 20;
    backdrop-filter: blur(12px);
  }

  .bottom-stat { text-align: center; }

  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: #e0004a;
    display: block;
    text-shadow: 0 0 15px rgba(224,0,74,0.7);
  }

  .stat-lbl {
    font-size: 0.58rem;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.35);
    font-weight: 700;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .separator { display: none; }
    .bottom-bar { gap: 1.2rem; }
    .stat-val { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="particles" id="particles"></div>
  <div class="scanlines"></div>

  <div class="content">

    <div class="club-badge">
      <span class="eggplant-icon">❤️</span>
      <div>
        <div class="club-name">ZIAD LOVES H</div>
        <div class="season-tag">موعد فشخ زياد 🔥</div>
      </div>
      <span class="eggplant-icon">❤️</span>
    </div>

    <div class="title-block">
      <div class="pre-title">🔥 ZIAD LOVES H 🔥</div>
      <div class="main-title">
        باقي
        <span id="days-big">--</span>
        يوم
      </div>
    </div>

    <div class="countdown-container">
      <div class="countdown-label">◆ الوقت المتبقي على موعد فشخ زياد ◆</div>
      <div class="countdown-grid">
        <div class="time-block">
          <span class="time-value" id="days">--</span>
          <div class="time-label">أيام</div>
        </div>
        <div class="separator">:</div>
        <div class="time-block">
          <span class="time-value" id="hours">--</span>
          <div class="time-label">ساعات</div>
        </div>
        <div class="separator">:</div>
        <div class="time-block">
          <span class="time-value" id="minutes">--</span>
          <div class="time-label">دقائق</div>
        </div>
        <div class="separator">:</div>
        <div class="time-block">
          <span class="time-value" id="seconds">--</span>
          <div class="time-label">ثواني</div>
        </div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-info">
        <span>15 أبريل 2026</span>
        <span id="progress-pct">0%</span>
        <span>17 يونيو 2026</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <div class="tagline">
      ZIAD &nbsp;❤️&nbsp; H &nbsp;•&nbsp; موعد فشخ زياد 🔥 &nbsp;•&nbsp;
      <strong>17 يونيو 2026</strong>
    </div>

  </div>
</div>

<div class="bottom-bar">
  <div class="bottom-stat">
    <span class="stat-val" id="stat-days">--</span>
    <span class="stat-lbl">DAYS LEFT</span>
  </div>
  <div class="bottom-stat">
    <span class="stat-val">❤️</span>
    <span class="stat-lbl">ZIAD LOVES H</span>
  </div>
  <div class="bottom-stat">
    <span class="stat-val">17/6</span>
    <span class="stat-lbl">موعد فشخ زياد</span>
  </div>
  <div class="bottom-stat">
    <span class="stat-val">🔥</span>
    <span class="stat-lbl">IT'S COMING</span>
  </div>
</div>

<script>
  const target = new Date('2026-06-17T00:00:00').getTime();
  const start  = new Date('2026-04-15T00:00:00').getTime();
  const total  = target - start;

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now  = Date.now();
    const diff = target - now;

    if (diff <= 0) {
      ['days','hours','minutes','seconds'].forEach(id => {
        document.getElementById(id).textContent = '00';
      });
      document.getElementById('days-big').textContent = '0';
      document.getElementById('stat-days').textContent = '0';
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('progress-pct').textContent = '100%';
      return;
    }

    const d = Math.floor(diff / 864e5);
    const h = Math.floor((diff % 864e5) / 36e5);
    const m = Math.floor((diff % 36e5) / 6e4);
    const s = Math.floor((diff % 6e4) / 1e3);

    const secEl = document.getElementById('seconds');
    if (secEl.textContent !== pad(s)) {
      secEl.classList.remove('flip');
      void secEl.offsetWidth;
      secEl.classList.add('flip');
    }

    document.getElementById('days').textContent    = pad(d);
    document.getElementById('hours').textContent   = pad(h);
    document.getElementById('minutes').textContent = pad(m);
    document.getElementById('seconds').textContent = pad(s);
    document.getElementById('days-big').textContent = d;
    document.getElementById('stat-days').textContent = d;

    const pct = Math.min(100, Math.max(0, ((now - start) / total) * 100));
    document.getElementById('progress-fill').style.width = pct.toFixed(1) + '%';
    document.getElementById('progress-pct').textContent  = pct.toFixed(1) + '%';
  }

  tick();
  setInterval(tick, 1000);

  // Particles
  (function() {
    const c = document.getElementById('particles');
    for (let i = 0; i < 22; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const sz = Math.random() * 5 + 2;
      p.style.cssText = [
        'width:' + sz + 'px',
        'height:' + sz + 'px',
        'left:' + (Math.random() * 100) + '%',
        'animation-duration:' + (Math.random() * 9 + 6) + 's',
        'animation-delay:' + (Math.random() * 9) + 's',
        'opacity:' + (Math.random() * 0.5 + 0.2)
      ].join(';');
      c.appendChild(p);
    }
  })();
</script>

</body>
</html>
